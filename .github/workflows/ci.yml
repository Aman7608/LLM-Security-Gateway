# Runs every check on GitHub, on each push to main and on pull requests.
# The same commands as on my computer, so "it works for me" can be checked.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# The jobs only read the code. They can't push, comment or change anything.
permissions:
  contents: read

# A newer push to the same branch cancels the older, unfinished run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to an exact commit, not just a version tag,
      # so a changed or hijacked tag can't change what runs here
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the job never needs to push

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install packages
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff (style and common bugs)
        run: |
          ruff check .
          ruff format --check .

      - name: mypy (types)
        run: mypy src tests scripts redteam

      - name: pytest (all test groups)
        run: pytest -q

  dashboard:
    name: Dashboard (types, lint, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install packages (exact versions from package-lock.json)
        run: npm ci --no-fund

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
