# Settings for the `alembic` command (database migrations, Phase 12).
# The gateway creates its tables by itself; this file is only for running
# Alembic by hand, for example:
#   .\.venv\Scripts\alembic.exe current     (which version the database is at)
#   .\.venv\Scripts\alembic.exe check       (do tables.py and the migrations match?)
#   .\.venv\Scripts\alembic.exe revision --autogenerate -m "Added a column"
#
# The database address is NOT written here. It comes from GATEWAY_DATABASE_URL
# (see src/llm_gateway/audit/migrations/env.py), so no password ends up in git.

[alembic]
script_location = src/llm_gateway/audit/migrations
file_template = v%%(rev)s_%%(slug)s
