# Security policy: what to do with each kind of finding.
#
# How a decision is made (see docs/10-policy-engine.md):
#   1. Each finding is checked against the rules for its direction, TOP TO BOTTOM.
#      The FIRST rule that matches it AND whose min_confidence is met gives it
#      its action. Order matters: put specific rules first.
#   2. A finding that matches no rule is allowed. The STRICTEST action wins:
#      block > redact > warn > allow.
#   3. "combine" rules: several weak findings together can raise the action.
#   4. Risk = the most serious finding acted on, raised one level when
#      different kinds of problems appear together (see "risk" below).
#   5. "block_at_risk" (optional): block anything at or above that risk.
#   6. If a detector crashed, the request is blocked (GATEWAY_FAIL_MODE=closed)
#      or only warned (GATEWAY_FAIL_MODE=open).
#
# "when" can use any of these (all given ones must match):
#   detector:      injection, pii or secret
#   category:      e.g. instruction_override, pii, secret
#   entity_types:  a list, e.g. [EMAIL_ADDRESS, PHONE_NUMBER]
#   min_severity:  low, medium, high or critical (this level or higher)
#
# Checks when this file is loaded (a broken file is never used):
#   - prompt injection can only be warned about or blocked, never redacted
#   - rule ids must be unique
#   - a rule that can never be reached (a broader rule above it always wins)
#     is an error
# If this file is broken at startup, a strict built-in policy is used instead.

version: 1

# How redacted text looks: label (<EMAIL_ADDRESS>), mask (*****) or remove ([REDACTED])
redaction_mode: label

risk:
  # An attack plus hidden characters, or personal data plus a secret, is
  # worse than either alone, so the risk goes up one level.
  escalate_on_mixed_categories: true

# ---------------------------------------------------------------------------
# input: prompts going TO the AI provider
# ---------------------------------------------------------------------------
input:
  rules:
    - id: in-block-injection
      description: Likely prompt injection. Never send it to the AI.
      when: { detector: injection }
      min_confidence: 0.7
      action: block

    - id: in-warn-possible-injection
      description: Weak injection signals (often innocent). Log them, let the prompt through.
      when: { detector: injection }
      action: warn

    - id: in-redact-secrets
      description: >-
        Keys, tokens and passwords must not leave the company. This includes weak
        matches (random-looking strings, test keys): hiding a harmless ID costs
        little, while sending a real key to a third party cannot be undone.
      when: { detector: secret }
      action: redact

    - id: in-warn-people-and-places
      description: Names and places are often needed for the task, so only warn.
      when: { detector: pii, entity_types: [PERSON, LOCATION, IP_ADDRESS] }
      action: warn

    - id: in-redact-personal-data
      description: Emails, phone numbers, cards and ID numbers are hidden before the prompt leaves.
      when: { detector: pii }
      action: redact

    - id: in-redact-confidential-terms
      description: Your secret project names and strong "confidential" markings stay in the company.
      when: { detector: confidential }
      min_confidence: 0.8
      action: redact

    - id: in-warn-confidential-markers
      description: Weaker markings like "internal only" or the word "confidential" are logged.
      when: { detector: confidential }
      action: warn

  # Several weak injection signals in one prompt (each only "warn" on its own)
  # are treated as an attack when together they are convincing enough.
  # Combined confidence uses noisy-OR: 1 - (1 - c1) * (1 - c2) * ...
  # Needs at least two DIFFERENT rules, so one weak phrase alone never blocks.
  combine:
    - id: in-block-many-weak-injection-signals
      description: Several different weak injection signals together are treated as an attack.
      when: { detector: injection }
      min_combined_confidence: 0.8
      action: block
      severity: high

  # Optional: block any prompt whose final risk is at this level or higher.
  # Off by default, because redacting is usually enough for personal data.
  # block_at_risk: critical

# ---------------------------------------------------------------------------
# output: answers coming FROM the AI provider
# ---------------------------------------------------------------------------
output:
  rules:
    - id: out-block-system-prompt-leak
      description: >-
        The answer repeats the hidden system prompt (its canary marker, or a long
        run of its words). Withheld completely.
      when: { detector: leak }
      action: block

    - id: out-block-secrets
      description: An AI answer containing a real-looking secret is withheld completely.
      when: { detector: secret }
      min_confidence: 0.7
      action: block

    - id: out-redact-possible-secrets
      description: Random-looking strings in answers are hidden, to be safe.
      when: { detector: secret }
      action: redact

    - id: out-redact-sensitive-personal-data
      description: Card numbers and ID numbers are hidden in answers.
      when: { detector: pii, min_severity: high }
      action: redact

    - id: out-redact-contact-details
      description: Emails and phone numbers are hidden in answers.
      when: { detector: pii, entity_types: [EMAIL_ADDRESS, PHONE_NUMBER] }
      action: redact

    - id: out-redact-confidential-terms
      description: Secret project names and strong "confidential" markings are hidden in answers.
      when: { detector: confidential }
      min_confidence: 0.8
      action: redact

    - id: out-warn-confidential-markers
      description: Weaker markings in answers are logged.
      when: { detector: confidential }
      action: warn

    - id: out-warn-injection-text
      description: The answer contains attack-like text (for example copied from a document).
      when: { detector: injection }
      min_confidence: 0.7
      action: warn

    # Names, places and IP addresses in answers are allowed: answers
    # naturally mention people and places, and they match no rule above.
