# Secret detection patterns: API keys, tokens, passwords and private keys.
#
# IMPORTANT: patterns run on the ORIGINAL text, not the lowercase cleaned
# view, because keys are case-sensitive (AKIA... is an AWS key, akia... is not).
# Use (?i:...) around the parts that should ignore case, like "password".
#
# Fields:
#   secret_type          name shown in findings and redaction, e.g. <AWS_ACCESS_KEY_ID>
#   secret_group         which regex group is the secret itself (0 = the whole match).
#                        For "password=<value>" we hide only <value>, not "password=".
#   check_placeholders   skip values that are obviously not real, like ${DB_PASS},
#                        <your-key>, ******** or os.environ["KEY"] (see placeholder_values)
#   require_mixed_chars  the value needs at least 2 kinds of character (lowercase,
#                        uppercase, digits, symbols). Stops "my password is strong".
#
# NEVER put a real secret in this file or in tests. The tests build fake ones
# when they run (see tests/data/secret_samples.py).

version: 1

# A value that FULLY matches one of these (case ignored) is treated as a
# placeholder, not a real secret. Only used by rules with check_placeholders.
placeholder_values:
  - '\$\{?[A-Za-z_][A-Za-z0-9_]*\}?'          # $DB_PASS or ${DB_PASS}
  - '%[A-Za-z_][A-Za-z0-9_]*%'                # %DB_PASS% (Windows)
  - '<[^>]*>?'                                # <your-api-key>
  - '\{\{.*'                                  # {{ template }}
  - '\{[A-Za-z_][A-Za-z0-9_.]*\}'             # {api_key} in Python f-strings and format strings
  - '[*xX#.-]+'                               # ******** or xxxxxxxx
  - '(?:your|my|the|some|example|sample|dummy|fake|placeholder|changeme|change_me|redacted|hidden|secret|password|passwd|pass|null|none|nil|true|false|undefined|empty|todo|tbd|xxx+)(?:[_-][a-z0-9_-]*)?'
  - '[A-Za-z_][A-Za-z0-9_]*(?:\.[A-Za-z_][A-Za-z0-9_]*)+.*'   # code: os.environ..., settings.db_password
  - '.*[(\[].*'                               # code: get_secret("x"), env["KEY"]
  - '[a-z]+(?:_[a-z]+)+'                      # variable names: user_password
  - '[a-z]+(?:[A-Z][a-z]+)+'                  # variable names: confirmPassword

# Long random-looking strings are often secrets, even in formats we do not
# know. This check is noisy, so its confidence is low (warn, not block).
entropy:
  enabled: true
  min_length: 24        # shorter strings are ignored
  min_entropy: 4.3      # bits per character; random letters+digits score about 4.5 to 5
  confidence: 0.5
  severity: medium
  max_candidates: 200   # stop after this many long strings, so huge inputs stay fast

rules:

  # ---------- Cloud providers ----------

  - id: aws-access-key-id
    description: AWS access key ID
    secret_type: AWS_ACCESS_KEY_ID
    confidence: 0.95
    severity: critical
    pattern: '\b(?:AKIA|ASIA|ABIA|ACCA)[A-Z0-9]{16}\b'

  - id: aws-secret-access-key
    description: AWS secret access key after its usual name
    secret_type: AWS_SECRET_ACCESS_KEY
    confidence: 0.9
    severity: critical
    secret_group: 1
    pattern: '(?i:aws_?secret_?(?:access_?)?key)["'']?[ \t]*[:=][ \t]*["'']?([A-Za-z0-9/+=]{40})(?![A-Za-z0-9/+=])'

  - id: google-api-key
    description: Google Cloud / Firebase API key
    secret_type: GOOGLE_API_KEY
    confidence: 0.9
    severity: high
    pattern: '\bAIza[0-9A-Za-z_-]{35}(?![0-9A-Za-z_-])'

  - id: azure-storage-key
    description: Azure storage account key in a connection string
    secret_type: AZURE_STORAGE_KEY
    confidence: 0.9
    severity: critical
    secret_group: 1
    pattern: 'AccountKey=([A-Za-z0-9+/]{86}==)'

  # ---------- AI providers ----------

  - id: openai-api-key
    description: OpenAI API key (contains the marker T3BlbkFJ)
    secret_type: OPENAI_API_KEY
    confidence: 0.95
    severity: critical
    pattern: '\bsk-(?:(?:proj|svcacct|admin)-)?[A-Za-z0-9_-]{20,}T3BlbkFJ[A-Za-z0-9_-]{20,}'

  - id: openai-project-key
    description: OpenAI project / service account key
    secret_type: OPENAI_API_KEY
    confidence: 0.85
    severity: critical
    pattern: '\bsk-(?:proj|svcacct|admin)-[A-Za-z0-9_-]{40,}'

  - id: anthropic-api-key
    description: Anthropic API key
    secret_type: ANTHROPIC_API_KEY
    confidence: 0.95
    severity: critical
    pattern: '\bsk-ant-(?:api|admin|sid)[0-9]{2}-[A-Za-z0-9_-]{40,}'

  - id: huggingface-token
    description: Hugging Face access token
    secret_type: HUGGINGFACE_TOKEN
    confidence: 0.9
    severity: high
    pattern: '\bhf_[A-Za-z0-9]{34,40}(?![A-Za-z0-9])'

  # ---------- Developer platforms ----------

  - id: github-token
    description: GitHub personal, OAuth, app or refresh token
    secret_type: GITHUB_TOKEN
    confidence: 0.95
    severity: high
    pattern: '\b(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36,255}\b'

  - id: github-fine-grained-token
    description: GitHub fine-grained personal access token
    secret_type: GITHUB_TOKEN
    confidence: 0.95
    severity: high
    pattern: '\bgithub_pat_[A-Za-z0-9_]{60,255}\b'

  - id: npm-token
    description: npm access token
    secret_type: NPM_TOKEN
    confidence: 0.9
    severity: high
    pattern: '\bnpm_[A-Za-z0-9]{36}(?![A-Za-z0-9])'

  - id: slack-token
    description: Slack bot / user / app token
    secret_type: SLACK_TOKEN
    confidence: 0.9
    severity: high
    pattern: '\bxox[abposr]-[0-9A-Za-z-]{10,250}'

  - id: slack-webhook
    description: Slack incoming webhook URL
    secret_type: SLACK_WEBHOOK
    confidence: 0.9
    severity: medium
    pattern: 'https://hooks\.slack\.com/services/T[A-Z0-9]{6,}/B[A-Z0-9]{6,}/[A-Za-z0-9]{20,}'

  # ---------- Payments and email ----------

  - id: stripe-live-key
    description: Stripe live secret or restricted key (real money)
    secret_type: STRIPE_SECRET_KEY
    confidence: 0.95
    severity: critical
    pattern: '\b(?:sk|rk)_live_[0-9A-Za-z]{20,}'

  - id: stripe-test-key
    description: Stripe test key (no real money, but still should not leak)
    secret_type: STRIPE_TEST_KEY
    confidence: 0.6
    severity: low
    pattern: '\b(?:sk|rk)_test_[0-9A-Za-z]{20,}'

  - id: sendgrid-api-key
    description: SendGrid API key
    secret_type: SENDGRID_API_KEY
    confidence: 0.95
    severity: high
    pattern: '\bSG\.[A-Za-z0-9_-]{22}\.[A-Za-z0-9_-]{43}(?![A-Za-z0-9_-])'

  # ---------- Keys and tokens in standard formats ----------

  - id: private-key
    description: Private key block (RSA, EC, DSA, OpenSSH, PGP)
    secret_type: PRIVATE_KEY
    confidence: 0.99
    severity: critical
    # The body allows a single "-" (as in "Proc-Type") but stops at "-----",
    # then takes the END line if there is one. If the END line is missing,
    # we still hide the whole body, so a cut-off key does not leak.
    pattern: '-----BEGIN (?:[A-Z0-9]+ ){0,3}PRIVATE KEY(?: BLOCK)?-----(?:[A-Za-z0-9+/=\s:,.]|-(?!----)){0,10000}(?:-----END (?:[A-Z0-9]+ ){0,3}PRIVATE KEY(?: BLOCK)?-----)?'

  - id: jwt
    description: JSON Web Token (three base64 parts, the first two start with eyJ)
    secret_type: JWT
    confidence: 0.85
    severity: high
    pattern: '\beyJ[A-Za-z0-9_-]{8,}\.eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}'

  - id: bearer-token
    description: Token after the word Bearer (HTTP Authorization header)
    secret_type: BEARER_TOKEN
    confidence: 0.8
    severity: high
    secret_group: 1
    pattern: '(?i:\bbearer)\s+([A-Za-z0-9._~+/-]{20,}=*)'

  # ---------- Passwords ----------

  - id: credentials-in-url
    description: Password inside a URL, e.g. postgres://user:PASSWORD@host
    secret_type: PASSWORD_IN_URL
    confidence: 0.9
    severity: critical
    secret_group: 1
    check_placeholders: true
    pattern: '\b[a-zA-Z][a-zA-Z0-9+.-]{1,20}://[^\s:/@"'']{1,100}:([^\s@/"'']{1,200})@[^\s/@"'']+'

  - id: secret-assignment
    description: 'password=..., api_key: ..., DB_PASSWORD=... in config files and code'
    secret_type: SECRET_ASSIGNMENT
    confidence: 0.75
    severity: high
    secret_group: 1
    check_placeholders: true
    require_mixed_chars: true
    pattern: '(?i:\b[a-z0-9_]{0,30}?(?:password|passwd|pwd|passphrase|secret|client_?secret|secret_?key|api_?key|apikey|access_?token|auth_?token|refresh_?token|private_?key|token))\b["'']?[ \t]*[:=][ \t]*["'']?([^\s"''`,;)]{3,199}[^\s"''`,;).])'

  - id: password-in-sentence
    description: '"My password is ..." or "the database password is ..." in normal writing'
    secret_type: PASSWORD
    confidence: 0.7
    severity: high
    secret_group: 1
    check_placeholders: true
    require_mixed_chars: true
    pattern: '(?i:\b(?:my|the|our|your|his|her|their)(?: [a-z0-9_-]{2,20}){0,2} (?:password|passcode|passphrase|pin) (?:is|was|=|:))[ \t]*["'']?([^\s"'',;]{3,99}[^\s"'',;.!?])'
