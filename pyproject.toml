# Project information and settings for the tools we use.
# Package versions are pinned in requirements.txt, not here.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-security-gateway"
version = "0.1.0"
description = "A security gateway that checks prompts and AI answers for prompt injection, personal data and secrets."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Aman Kumar" }]

[tool.setuptools.packages.find]
where = ["src"]

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: tests one small piece on its own",
    "integration: tests several pieces working together",
    "security: attack and leak tests",
    "e2e: tests the whole running system",
]
# An error inside a background thread fails the test, instead of only
# printing a warning that is easy to miss (added after the Phase 9 thread bug)
filterwarnings = [
    "error::pytest.PytestUnhandledThreadExceptionWarning",
]
# If one test runs longer than 120 seconds, print where every thread is
# stuck. (Added after a full test run hung once and could not be repeated.)
faulthandler_timeout = 120

# ---------- coverage ----------
[tool.coverage.run]
source = ["llm_gateway"]
branch = true
# Alembic loads migration files by their path, and coverage does not see
# them run. They ARE tested: test_migrations_match_the_table_classes only
# passes if the migrations created exactly the tables in audit/tables.py.
omit = ["*/audit/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false

# ---------- ruff (style and lint) ----------
[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W = PEP 8 style, F = real errors, I = import order, B = common bugs,
# UP = modern Python syntax, S = security problems (bandit rules)
select = ["E", "W", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests use plain assert statements, which is normal for pytest, and seeded
# random numbers so results repeat exactly (not for anything secret)
"tests/**" = ["S101", "S311"]
# Sample prompts are long sentences; splitting them would make them harder to read
"tests/data/**" = ["S101", "E501"]

# ---------- mypy (type checking) ----------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
